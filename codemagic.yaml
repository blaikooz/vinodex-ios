# Codemagic CI for vinodex-ios.
#
# This is NOT a React Native or Xcode project: the app is a SwiftPM package
# built by xtool (see xtool.yml / Package.swift). Two workflows:
#
#   ios-xtool      — push gate on main/testing. Mirrors scripts/gate.sh:
#                    `swift test` (VinodexCore only; UI targets are iOS-only)
#                    then a clean `xtool dev build --ipa`. Unsigned artifact.
#
#   ios-testflight — release pipeline, triggered by pushing a `v*` tag (tags
#                    are the version of record — see README "Deploying").
#                    Builds release, stamps the real version over xtool's
#                    hardcoded 1.0.0/1 (xtool 1.17 has no distribution
#                    signing: `xtool dev build` offers only --ipa/--triple/-c,
#                    so the .app is re-signed by hand), fetches App Store
#                    signing files via codemagic-cli-tools, re-signs, packages
#                    Vinodex.ipa and uploads to TestFlight.
#
# The TestFlight workflow needs two things that live in the Codemagic UI, not
# in this file (see README or ask for the runbook):
#   1. An App Store Connect integration named exactly "Vinodex ASC Key"
#      (Teams > Integrations > Developer Portal: .p8 key + Key ID + Issuer ID).
#   2. An env group "appstore_credentials" containing secret var
#      CERTIFICATE_PRIVATE_KEY_B64 — an RSA 2048 private key (PEM) that
#      fetch-signing-files uses to create the Apple Distribution certificate,
#      base64-encoded to one line because a multiline PEM pasted into the
#      Codemagic UI arrived mangled twice ("--certificate-key ... is not
#      valid", 2026-08-11):
#        ssh-keygen -t rsa -b 2048 -m PEM -f cert_key -q -N ""
#        base64 -w0 cert_key > cert_key.b64   # paste cert_key.b64's one line

workflows:
  ios-xtool:
    name: Vinodex iOS — test + xtool build
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 26.4
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: testing
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install xtool
        script: |
          brew install xtool-org/tap/xtool
          xtool --version
      - name: swift test (VinodexCore)
        script: swift test
      - name: Clean xtool build
        script: |
          rm -rf .build xtool
          xtool dev build --ipa
      - name: Verify ipa
        script: ls -l xtool/*.ipa
    artifacts:
      - xtool/*.ipa

  ios-testflight:
    name: Vinodex iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "Vinodex ASC Key"
    environment:
      groups:
        - appstore_credentials # CERTIFICATE_PRIVATE_KEY_B64
      xcode: 26.4
      vars:
        BUNDLE_ID: "com.blaikooz.vinodex"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install xtool
        script: |
          brew install xtool-org/tap/xtool
          xtool --version
      - name: swift test (VinodexCore)
        script: swift test
      - name: Build release app with xtool
        script: |
          xtool dev build -c release
          test -d xtool/Vinodex.app || { echo "no .app produced"; exit 1; }
      - name: Stamp real version over xtool's 1.0.0
        # xtool 1.17 writes CFBundleShortVersionString=1.0.0 / CFBundleVersion=1
        # into every bundle (see AppVersion.swift). TestFlight rejects repeat
        # (version, build) pairs, so: version from the v* tag, build from
        # Codemagic's per-workflow BUILD_NUMBER.
        script: |
          set -e
          APP="xtool/Vinodex.app"
          VERSION="${CM_TAG:-$(git describe --tags --abbrev=0)}"
          VERSION="${VERSION#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Info.plist" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$APP/Info.plist" \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NUMBER" "$APP/Info.plist"
          echo "version $VERSION build $BUILD_NUMBER"
      - name: Stamp Xcode build metadata (DT keys)
        # xtool writes none of the DT* build-environment keys Xcode stamps.
        # ASC validation requires DTPlatformName (90507) and, with no DTSDKName
        # to read, infers "built with the iOS 17.0 SDK" from MinimumOSVersion
        # and rejects (90725). Values come from the builder's real toolchain.
        script: |
          set -e
          PLIST="xtool/Vinodex.app/Info.plist"
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_BUILD=$(xcrun --sdk iphoneos --show-sdk-build-version)
          XCODE_BUILD=$(xcodebuild -version | awk '/Build version/{print $3}')
          DTXCODE=$(xcodebuild -version | awk 'NR==1{split($2,v,"."); printf "%s%s%s", v[1], v[2], (v[3]=="" ? "0" : v[3])}')
          plist_put() {
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST"
          }
          plist_put DTPlatformName iphoneos
          plist_put DTPlatformVersion "$SDK_VERSION"
          plist_put DTSDKName "iphoneos$SDK_VERSION"
          plist_put DTSDKBuild "$SDK_BUILD"
          plist_put DTPlatformBuild "$SDK_BUILD"
          plist_put DTXcode "$DTXCODE"
          plist_put DTXcodeBuild "$XCODE_BUILD"
          plist_put DTCompiler com.apple.compilers.llvm.clang.1_0
          plist_put BuildMachineOSBuild "$(sw_vers -buildVersion)"
          echo "stamped: iphoneos$SDK_VERSION ($SDK_BUILD), Xcode $DTXCODE ($XCODE_BUILD)"
      - name: Compile app icon asset catalog
        # ASC requires icons as a compiled Assets.car + CFBundleIconName
        # (90713) and an iPad 152pt entry (90023); xtool only drops
        # AppIcon.png in the bundle root. Build a single-size (1024) icon
        # catalog with actool and merge its partial plist. AppIcon.png in the
        # repo is verified 1024x1024 RGB, no alpha (ASC rejects transparency).
        script: |
          set -e
          APP="xtool/Vinodex.app"
          ICONSET=/tmp/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICONSET"
          cp AppIcon.png "$ICONSET/AppIcon.png"
          printf '%s' '{"info":{"author":"xcode","version":1}}' > /tmp/Assets.xcassets/Contents.json
          printf '%s' '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICONSET/Contents.json"
          actool /tmp/Assets.xcassets --compile "$APP" \
            --platform iphoneos --minimum-deployment-target 17.0 \
            --target-device iphone --target-device ipad \
            --app-icon AppIcon --output-partial-info-plist /tmp/icon-partial.plist
          test -f "$APP/Assets.car" || { echo "actool produced no Assets.car"; exit 1; }
          /usr/libexec/PlistBuddy -c "Merge /tmp/icon-partial.plist" "$APP/Info.plist"
          plutil -p "$APP/Info.plist" | grep -i icon
      - name: Patch Mach-O SDK version (LC_BUILD_VERSION)
        # 90725 survived the DT plist keys: xtool's link step records the
        # deployment target (17.0) as the *SDK* version in the binary's
        # LC_BUILD_VERSION, and ASC reads the Mach-O. Rewrite the sdk field
        # to the toolchain's real SDK; minos stays whatever the build set.
        # Runs before re-sign, so the signature covers the patched binary.
        script: |
          set -e
          BIN="xtool/Vinodex.app/Vinodex"
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "--- before ---"; vtool -show-build "$BIN"
          MINOS=$(vtool -show-build "$BIN" | awk '/minos/{print $2; exit}')
          vtool -set-build-version ios "${MINOS:-17.0}" "$SDK_VERSION" \
            -replace -output /tmp/Vinodex.patched "$BIN"
          mv /tmp/Vinodex.patched "$BIN"
          chmod +x "$BIN"
          echo "--- after ---"; vtool -show-build "$BIN"
      - name: Fetch App Store signing files + keychain
        # Integration "Vinodex ASC Key" provides APP_STORE_CONNECT_ISSUER_ID /
        # _KEY_IDENTIFIER / _PRIVATE_KEY. The certificate key arrives base64'd
        # in CERTIFICATE_PRIVATE_KEY_B64 (appstore_credentials group) and is
        # decoded to a file — a multiline PEM in a UI secret got mangled in
        # transit twice. --profiles-dir is pinned because the default is
        # ~/Library/Developer/Xcode/UserData/..., not MobileDevice.
        script: |
          set -e
          echo "CERTIFICATE_PRIVATE_KEY_B64 length: ${#CERTIFICATE_PRIVATE_KEY_B64} (expect ~2240)"
          test -n "${CERTIFICATE_PRIVATE_KEY_B64:-}" || { echo "var is EMPTY: check it exists in the appstore_credentials group (click Add before Save)"; exit 1; }
          printf '%s' "$CERTIFICATE_PRIVATE_KEY_B64" | tr -d '[:space:]' | base64 --decode > /tmp/cert_key
          grep -q "BEGIN RSA PRIVATE KEY" /tmp/cert_key || { echo "decoded key is not a PEM RSA key"; exit 1; }
          chmod 600 /tmp/cert_key
          keychain initialize
          # --strict-match-identifier: without it the loose identifier match
          # latched onto xtool's XTL-N6BL8PYJ5X.com.blaikooz.vinodex App ID
          # and signed with a profile for the wrong identity (2026-08-13).
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create --strict-match-identifier \
            --profiles-dir /tmp/profiles \
            --certificate-key=@file:/tmp/cert_key
          keychain add-certificates
      - name: Re-sign for distribution + package ipa
        # Flat bundle: one binary + resource-only .bundle dirs, no Frameworks/,
        # so a single codesign of the .app is the whole signing job (no --deep;
        # --options runtime is macOS-only and stays out).
        script: |
          set -e
          APP="xtool/Vinodex.app"
          PROFILE=$(ls /tmp/profiles/*.mobileprovision | head -1)
          cp "$PROFILE" "$APP/embedded.mobileprovision"
          security cms -D -i "$PROFILE" > /tmp/prof.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' /tmp/prof.plist > /tmp/ent.plist
          IDENTITY=$(security find-identity -v -p codesigning | grep -oE '"Apple Distribution[^"]*"' | head -1 | tr -d '"')
          test -n "$IDENTITY" || { echo "no Apple Distribution identity in keychain"; exit 1; }
          codesign --force --timestamp --sign "$IDENTITY" --entitlements /tmp/ent.plist "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          rm -rf Payload Vinodex.ipa
          mkdir Payload && cp -R "$APP" Payload/
          zip -qry Vinodex.ipa Payload
          ls -la Vinodex.ipa
    artifacts:
      - Vinodex.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
