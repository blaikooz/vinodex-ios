version: 1
# NOTE: reverted from com.blaikooz.vinodex on 2026-07-28. A free Apple
# profile caps App IDs at three, and this account already holds
# com.example.{Vinodex,Hello,VinodexSpike} -- uninstalling the apps does not
# release them. Reusing this existing App ID is the only way to deploy.
# Change to a real reverse-DNS ID before any signing that matters, once the
# quota frees up or on a paid account.
bundleID: com.example.Vinodex
iconPath: AppIcon.png

# NO ORIENTATION KEY HERE, DELIBERATELY (AUDIT M17). The app is portrait-only
# and the audit's proposed fix was `UISupportedInterfaceOrientations` in the
# generated Info.plist -- but xtool generates that plist itself and this file is
# not a passthrough for it. `version:` above is the config-schema version, not
# the app's; xtool 1.17 hardcodes CFBundleShortVersionString and there is no key
# to override it either (see KNOWN-ISSUES.md). Adding a speculative key here
# would read as a lock while doing nothing.
#
# The lock is `AppDelegate.application(_:supportedInterfaceOrientationsFor:)` in
# Sources/VinodexApp/VinodexApp.swift. That callback is consulted per window and
# takes precedence over the plist regardless, so it is the stronger of the two
# -- if a future xtool does expose plist keys, add it there as belt and braces,
# not as a replacement.
