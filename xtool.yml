version: 1
# NOTE: reverted from com.blaikooz.vinodex on 2026-07-28. A free Apple
# profile caps App IDs at three, and this account already holds
# com.example.{Vinodex,Hello,VinodexSpike} -- uninstalling the apps does not
# release them. Reusing this existing App ID is the only way to deploy.
# Change to a real reverse-DNS ID before any signing that matters, once the
# quota frees up or on a paid account.
bundleID: com.example.Vinodex
iconPath: AppIcon.png

# Required since v0.9.0: Package.swift exports three library products
# (Vinodex, VinodexCore, VinodexUI -- arch A5), and xtool 1.17.0 refuses to
# guess which one is the app. Vinodex is the product wrapping VinodexApp.
product: Vinodex

# Partial Info.plist, merged over xtool's generated one (0.7.2, LR1). Added for
# LABEL SCAN's NSCameraUsageDescription / NSPhotoLibraryUsageDescription -- see
# Info.plist itself, which documents the merge rules.
infoPath: Info.plist

# CORRECTION (0.7.2). The paragraph that stood here said xtool "generates that
# plist itself and this file is not a passthrough for it", and that there was no
# key to override the version either. Both were true of whatever xtool was
# checked at the time and are false of the installed 1.17.0, whose schema is
# `version, orgID, bundleID, product, infoPath, entitlementsPath, iconPath,
# resources, extensions[]`. `infoPath` above is that passthrough: xtool builds
# its default dictionary, then shallow-merges the referenced file's top-level
# keys over it, ours winning. Only four keys are stamped after the merge and are
# therefore genuinely unsettable -- UIRequiredDeviceCapabilities,
# LSRequiresIPhoneOS, CFBundleSupportedPlatforms, CFBundleIconFile.
# CFBundleShortVersionString is NOT among them; see AppVersion.swift.
#
# STILL NO ORIENTATION KEY, and now for a better reason than "there is nowhere
# to put it" (AUDIT M17). There is somewhere to put it, and it should stay
# empty: the lock is
# `AppDelegate.application(_:supportedInterfaceOrientationsFor:)` in
# Sources/VinodexApp/VinodexApp.swift, that callback is consulted per window and
# takes precedence over the plist regardless, and a second declaration would be
# a second thing to keep in agreement for no additional guarantee.
