name: CI

# The Linux-ready half of the package, run on every push and PR.
#
# `VinodexCore` is deliberately Foundation-only so it builds and tests on Linux
# without a Mac or a Darwin SDK — that is what makes this workflow possible on
# free runners. `VinodexUI` and `VinodexApp` are wrapped in
# `#if canImport(SwiftUI) && canImport(UIKit)` and compile to nothing here, so
# a green run does **not** mean the app builds; see the note in the summary step.
# Closes AUDIT.md M34.

# Every branch, not just main. Work happens on `audit` and on the `vN.N-batch`
# branches, and scoping this to `[main]` meant a push to any of them ran nothing
# at all — the batch that broke the macOS build was never checked by anything.
on:
  push:
    branches: ['**']
  pull_request:

# A force-push or a quick follow-up commit should cancel the older run rather
# than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Cached separately from the build so a dependency-free package still
      # benefits once one is added; today this is close to a no-op.
      #
      # The repository name is part of the key, and that is not decoration.
      # `.build` holds precompiled headers with **absolute** paths baked in
      # (`/__w/<repo>/<repo>/.build/...`). This repo was renamed from
      # `vinodex-swift` to `vinodex-ios`, the old key still matched because
      # Package.swift had not changed, and the restored PCH pointed at a
      # workspace path that no longer existed — so every single file failed with
      # `PCH was compiled with module cache path ...` and `missing required
      # module 'SwiftShims'`. A green branch failed CI on cache contents alone,
      # and the error names neither the cache nor the rename.
      #
      # Keying on the name means the checkout path is part of the identity of the
      # cache, so the next rename misses instead of poisoning. `restore-keys` is
      # scoped the same way for the same reason — an unscoped prefix fallback
      # would walk straight back into a stale entry.
      - name: Cache .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-${{ github.repository }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-swiftpm-${{ github.repository }}-

      - name: Test
        run: swift test --enable-code-coverage

      # `TypeScale.nominalFloor` clamps at run time, so a sub-floor literal is
      # not a *bug* — it just draws at 10 while claiming to draw at 8, which is
      # how the app accumulated ten of them across six screens without anyone
      # noticing. The unit tests cannot see VinodexUI (it compiles to nothing on
      # Linux), so grep is the only thing that can hold this line. Closes the
      # loop on AUDIT H11.
      - name: Type floor (AUDIT H11)
        run: |
          bad=$(grep -rnE 'DexFont\.(retro|mono)\(([0-9]|[0-9]\.[0-9]+)\)' Sources/ || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error title=Type floor::Below TypeScale.nominalFloor (10). The clamp will lift these to 10 anyway — write 10."
            exit 1
          fi
          echo "no DexFont call site below the floor"

      - name: Note what this does not cover
        if: always()
        run: |
          echo "::notice title=Scope::VinodexUI and VinodexApp are guarded behind canImport(UIKit) and compile to nothing on Linux. A *type* error in the UI layer cannot fail this job — the 'ios' job is what catches those. (A syntax error would fail here: inactive #if branches are still parsed.)"

  # ── The only Xcode-grade type check this project has ─────────────────────────
  #
  # Neither maintainer can install Xcode, and xtool has no `test` subcommand and
  # no simulator support — it builds and sideloads to a physical device only. So
  # before this job, the only thing that ever type-checked the SwiftUI sources was
  # someone plugging in a phone.
  #
  # That gap is not theoretical. Measured on 2026-07-31 with Swift 6.2.3: an
  # undefined symbol injected inside `#if canImport(UIKit)` in Haptics.swift
  # produced "Build complete!" from `swift build` on macOS and was invisible to
  # `swift test` on Linux. Only an iOS compile sees it — and that is exactly the
  # class of break that shipped as auditS C1.
  #
  # macOS runners are free on public repos. Note that a *macOS* build would not
  # help: UIKit is unavailable there too, so VinodexUI compiles to nothing on
  # macOS just as it does on Linux. `generic/platform=iOS` is the whole point.
  ios:
    name: iOS compile (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # No signing, no device, no simulator boot — a pure compile.
      - name: Build for iOS
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Vinodex \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO

  # ── iOS-hosted tests, on a runner instead of a Mac someone owns ──────────────
  #
  # This is what makes UIKit/SwiftUI-dependent tests writable at all. Today it
  # runs the existing VinodexCoreTests in a real iOS environment, which is already
  # worth something (Foundation differs from Linux). Its real purpose is to give
  # a `VinodexUITests` target somewhere to run: guard every file in it with
  # `#if canImport(SwiftUI) && canImport(UIKit)`, exactly as all 34 files in
  # Sources/VinodexUI/ already are, and it compiles to an empty module on Linux
  # while running for real here.
  ios-test:
    name: iOS tests (Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Available simulators
        run: xcrun simctl list devices available

      - name: Test on iOS Simulator
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Vinodex \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO

  # The generated data is committed, so a drifted checkout means someone edited
  # shared/ without regenerating. Cheap to catch here; confusing to find later.
  data:
    name: generated data is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tooling
        run: npm install --no-audit --no-fund

      - name: Regenerate
        run: npm run generate

      # Generation is deterministic, so a clean tree here proves the committed
      # JSON matches shared/. Icons are not regenerated: that step needs network
      # access to the Iconify API and rsvg-convert, and is run by hand.
      - name: Check for drift
        run: |
          if ! git diff --quiet -- Sources/VinodexCore/Resources; then
            echo "::error title=Stale data::Sources/VinodexCore/Resources is out of date with shared/. Run 'npm run generate' and commit the result."
            git diff --stat -- Sources/VinodexCore/Resources
            exit 1
          fi
          echo "generated data matches shared/"
